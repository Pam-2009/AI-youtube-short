name: Generate Thai Short Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube or TikTok Video URL'
        required: true
        type: string
      start_time:
        description: 'Start time in seconds (e.g. 0)'
        required: false
        default: '0'
      end_time:
        description: 'End time in seconds (e.g. 30)'
        required: false
        default: '30'

jobs:
  process-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Pipeline
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python main.py "${{ github.event.inputs.video_url }}" "${{ github.event.inputs.start_time }}" "${{ github.event.inputs.end_time }}"

      - name: Upload Thai Video Result
        uses: actions/upload-artifact@v4
        with:
          name: thai-short-video
          path: output_thai_short.mp4
